# Render Infrastructure Blueprint for CourseGuide AI
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: courseguide-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: groq/compound-mini
      - key: PYTHON_VERSION
        value: 3.11.8
